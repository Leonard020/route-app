services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: route
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d route"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/route
      JWT_SECRET: change-me-in-prod
      TAGO_SERVICE_KEY: ${TAGO_SERVICE_KEY:-}
      SEOUL_SUBWAY_KEY: ${SEOUL_SUBWAY_KEY:-sample}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
